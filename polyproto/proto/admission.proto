syntax = "proto3";
package admission;

message Blob {
  bytes id = 1;
  uint64 bytes = 2;
  bool accelerated = 3;
}

message CanSatisfyRequest {
  uint64 task = 1;
  repeated Blob downstream = 2;
}

message CanSatisfyReply {
  bool ok = 1;
  uint64 reclaimable = 2;
  uint64 reclaimable_hbm = 3;
}

service Admission {
  rpc CanSatisfy(CanSatisfyRequest) returns (CanSatisfyReply);
}

message EchoRequest { bytes payload = 1; }
message EchoReply { uint64 n = 1; }

service Echo {
  rpc Call(EchoRequest) returns (EchoReply);
}
